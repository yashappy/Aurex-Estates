name: Deploy Backend & Admin API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🗄️ Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: 🔨 Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: 📦 Prepare Deployment Bundle
        run: |
          mkdir -p backend-deploy
          cp -r backend/dist backend-deploy/
          cp -r backend/prisma backend-deploy/
          cp backend/package.json backend-deploy/
          cp backend/.env.example backend-deploy/.env.example
          # Ensure uploads directory placeholder exists
          mkdir -p backend-deploy/uploads

      - name: 🚀 Push Compiled Backend to 'backend-production' Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: backend-production
          folder: backend-deploy

      - name: 🌐 Deploy Backend via FTP to Hostinger Subdomain (public_html/admin/)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-deploy/
          server-dir: admin/
          protocol: ftp
